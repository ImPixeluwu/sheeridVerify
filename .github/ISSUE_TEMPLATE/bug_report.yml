name: Bug report
description: Report a reproducible runtime or deployment issue; please redact first.
body:
  - type: markdown
    attributes:
      value: Do not upload a full configuration, real verification links, names, dates of birth, materials, passwords, cookies, or proxy credentials. Please report security vulnerabilities privately per SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, the project commit version, and whether it is a local or remote deployment.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps using a local mock page or a redacted example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error message
      render: text
